# Replace these two values with the keys shown by the SonarCloud project before
# the first stage 7 run. Do not put the SonarCloud token in this file.
sonar.organization=Abdullah-Latif-10_DevOps_Final_project
sonar.projectKey=abdullah-latif-10

sonar.projectName=Task Tracker

sonar.sources=services/backend/src,services/frontend/src,services/frontend/public
sonar.tests=services/backend/tests,services/frontend/tests
sonar.javascript.lcov.reportPaths=services/backend/coverage/lcov.info,services/frontend/coverage/lcov.info

# These paths remain analysed for bugs and security issues; they are excluded
# only from the coverage calculation.
sonar.coverage.exclusions=**/src/server.js,services/frontend/public/**
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
