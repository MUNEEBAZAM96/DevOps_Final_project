name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: "2. Secret scan (Gitleaks)"
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install Gitleaks and verify its checksum
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 -fsSLO "$base/$file"
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $file$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum --check
          tar -xzf "$file" gitleaks
      - name: Scan the complete Git history
        run: ./gitleaks git --redact --verbose .

  lint:
    name: "3. Lint (ESLint)"
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/*/package-lock.json
      - name: Run ESLint on each service
        run: |
          set -euo pipefail
          for service in backend frontend; do
            echo "Linting $service"
            (cd "services/$service" && npm ci && npm run lint)
          done

  format:
    name: "4. Format check (Prettier)"
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/*/package-lock.json
      - name: Check formatting of each service
        run: |
          set -euo pipefail
          for service in backend frontend; do
            echo "Checking format of $service"
            (cd "services/$service" && npm ci && npm run format:check)
          done

  dockerfile-lint:
    name: "5. Dockerfile lint (Hadolint)"
    needs: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Lint the backend Dockerfile
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: services/backend/Dockerfile
          failure-threshold: info
      - name: Lint the frontend Dockerfile
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: services/frontend/Dockerfile
          failure-threshold: info
      - name: Check the shell scripts with ShellCheck
        run: shellcheck scripts/*.sh deploy/*.sh

  unit-tests:
    name: "6. Unit tests (Jest)"
    needs: dockerfile-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/*/package-lock.json
      - name: Run tests with coverage for each service
        run: |
          set -euo pipefail
          for service in backend frontend; do
            echo "Testing $service"
            (cd "services/$service" && npm ci && npm test)
          done
      - name: Save coverage reports for SonarCloud (stage 7)
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: services/*/coverage/lcov.info
          retention-days: 7

  sonarcloud:
    name: "7. Static analysis (SonarCloud)"
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Download coverage reports from stage 6
        uses: actions/download-artifact@v7
        with:
          name: coverage
          path: services
      - name: Analyse with SonarCloud
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  dependency-scan:
    name: "8. Dependency scan (Snyk)"
    needs: sonarcloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/*/package-lock.json
      - name: Install dependencies so Snyk sees the full tree
        run: |
          set -euo pipefail
          for service in backend frontend; do
            (cd "services/$service" && npm ci --ignore-scripts)
          done
      - name: Install Snyk CLI without lifecycle scripts
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/snyk-cli"
          mkdir -p "$install_dir"
          npm install --prefix "$install_dir" --ignore-scripts --no-save snyk@1.1308.4
      - name: Fail on high or critical vulnerabilities
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/snyk-cli"
          "$install_dir/node_modules/.bin/snyk" test --all-projects --severity-threshold=high

  build-image:
    name: "9. Build images"
    needs: dependency-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build both images and save them for the next jobs
        run: |
          set -euo pipefail
          tag="sha-${GITHUB_SHA::7}"
          for service in backend frontend; do
            docker build -t "devops-task-tracker/$service:$tag" "services/$service"
          done
          docker save -o images.tar \
            "devops-task-tracker/backend:$tag" "devops-task-tracker/frontend:$tag"
      - uses: actions/upload-artifact@v6
        with:
          name: images
          path: images.tar
          retention-days: 1

  image-scan:
    name: "10. Image scan (Trivy)"
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6 # for .trivyignore, if the group ever needs one
      - uses: actions/download-artifact@v7
        with:
          name: images
      - name: Load the images
        run: |
          docker load -i images.tar
          echo "TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Scan the backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devops-task-tracker/backend:${{ env.TAG }}
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Scan the frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devops-task-tracker/frontend:${{ env.TAG }}
          severity: HIGH,CRITICAL
          exit-code: "1"

  push-image:
    name: "11. Push images to ECR"
    needs: image-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets the job get short-lived AWS credentials through OIDC
    outputs:
      tag: ${{ steps.tags.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: images
      - name: Load the images
        run: docker load -i images.tar
      - name: Work out the two tags
        id: tags
        run: |
          echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "version_tag=v$(tr -d '[:space:]' < VERSION).${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - name: Sign in to AWS with OIDC (no stored keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.CI_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Tag and push both images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SHA_TAG: ${{ steps.tags.outputs.sha_tag }}
          VERSION_TAG: ${{ steps.tags.outputs.version_tag }}
        run: |
          set -euo pipefail
          for service in backend frontend; do
            repo="devops-task-tracker/$service"
            for tag in "$SHA_TAG" "$VERSION_TAG"; do
              # Tags are immutable in ECR, so skip a tag that is already there
              # (for example when a run is re-run).
              if aws ecr describe-images --repository-name "$repo" \
                --image-ids imageTag="$tag" >/dev/null 2>&1; then
                echo "$repo:$tag already exists, skipping"
                continue
              fi
              docker tag "$repo:$SHA_TAG" "$REGISTRY/$repo:$tag"
              docker push "$REGISTRY/$repo:$tag"
            done
          done
      - name: Store this version's Compose file in Parameter Store
        env:
          SHA_TAG: ${{ steps.tags.outputs.sha_tag }}
        run: |
          aws ssm put-parameter --name "/devops-task-tracker/compose/$SHA_TAG" \
            --type String --overwrite --value file://docker-compose.prod.yml
